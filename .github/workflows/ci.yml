name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Host configuration matches security/headers.js
        run: npm run headers:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the real build and headers
        run: npm run test:e2e

      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: crf-site
          path: dist
          retention-days: 14
